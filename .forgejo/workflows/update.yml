name: "Update Zed packages ❄️"
on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 0" # https://crontab.guru/#0_10_*_*_0
jobs:
  update-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Update flake packages
        run: |
          export GIT_AUTHOR_NAME=runner[ci]
          export GIT_AUTHOR_EMAIL=runner@mtech.zt
          export GIT_COMMITTER_NAME=$GIT_AUTHOR_NAME
          export GIT_COMMITTER_EMAIL=$GIT_AUTHOR_EMAIL
          nix run nixpkgs#nix-update -- -F zed-editor-bin --commit --build -u -vr '^v(\d+\.\d+\.\d+)$'
          nix run nixpkgs#nix-update -- -F zed-editor --commit --build -u -vr '^v(\d+\.\d+\.\d+)$'
          nix run nixpkgs#nix-update -- -F zed-editor-pre --commit --build -u -vr '^v(\d+\.\d+\.\d+-pre)$'
        # uses: selfuryon/nix-update-action@main
